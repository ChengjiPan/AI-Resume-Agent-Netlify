<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calvin AI Resume Assistant</title>
  <style>
    :root{--ink:#172033;--muted:#63708a;--line:#e5e9f2;--brand:#315cf5;--paper:#fff;--ground:#f5f7fb}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--ground);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:820px;min-height:100vh;margin:auto;padding:68px 24px 36px;display:flex;flex-direction:column}.eyebrow{color:var(--brand);font-weight:700;letter-spacing:.08em;font-size:12px;text-transform:uppercase}h1{font-size:clamp(32px,6vw,52px);margin:12px 0;letter-spacing:-.045em}.intro{max-width:620px;color:var(--muted);line-height:1.75}.suggestions{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0}button{font:inherit;cursor:pointer}.chip{background:#fff;border:1px solid var(--line);border-radius:99px;color:#43506a;padding:9px 13px;font-size:14px}.chip:hover{border-color:var(--brand);color:var(--brand)}#chat{flex:1;display:flex;flex-direction:column;gap:16px;padding-bottom:20px}.message{max-width:92%;border-radius:18px;padding:16px 18px;line-height:1.75;white-space:pre-wrap}.assistant{background:var(--paper);border:1px solid var(--line);align-self:flex-start;box-shadow:0 4px 20px #26385c08}.user{background:var(--brand);color:#fff;align-self:flex-end}.sources{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.sources summary{cursor:pointer;color:#43506a;font-weight:700}.source-item{margin:8px 0 0;padding:9px 10px;border-radius:9px;background:#f7f9fd;line-height:1.55}.source-title{color:#43506a;font-weight:700}.source-excerpt{margin-top:4px;color:var(--muted)}form{display:flex;gap:10px;background:#fff;padding:10px;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px #26385c10}input{border:0;outline:0;flex:1;min-width:0;font:inherit;padding:8px}.send{border:0;color:#fff;background:var(--brand);padding:9px 15px;border-radius:10px;font-weight:700}.send:disabled{opacity:.55;cursor:wait}footer{color:var(--muted);font-size:12px;text-align:center;margin-top:16px}
  </style>
</head>
<body><main>
  <div class="eyebrow">Personal career AI agent</div><h1>Calvin AI Resume Assistant</h1>
  <p class="intro">基于潘成己的真实简历知识库回答。你可以像和候选人聊天一样，了解实习、项目、产品能力与职业优势。</p>
  <div class="suggestions"><button class="chip">完整介绍京东健康 AI 分诊 Agent 项目</button><button class="chip">完整介绍支付宝 NFC 项目经历</button><button class="chip">你的产品能力和职业优势是什么？</button></div>
  <section id="chat" aria-live="polite"><div class="message assistant">你好，我是潘成己的 AI Resume Assistant。我的回答仅基于已整理的真实资料；如果资料不足，我会明确说明。</div></section>
  <form id="form"><input id="question" autocomplete="off" placeholder="输入你想了解的问题…" aria-label="问题"><button class="send" id="send" type="submit">发送</button></form><footer>AI Resume Assistant · 基于个人知识库的 RAG 问答</footer>
</main><script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#question'),send=document.querySelector('#send');
function add(text,role,sources=[]){const box=document.createElement('div');box.className='message '+role;box.textContent=text;if(sources.length){const details=document.createElement('details');details.className='sources';const summary=document.createElement('summary');summary.textContent=`查看资料依据（${sources.length} 条）`;details.appendChild(summary);sources.forEach(source=>{const item=document.createElement('div');item.className='source-item';const title=document.createElement('div');title.className='source-title';title.textContent=source.file+(source.section?` · ${source.section}`:'');item.appendChild(title);if(source.excerpt){const excerpt=document.createElement('div');excerpt.className='source-excerpt';excerpt.textContent=source.excerpt;item.appendChild(excerpt)}details.appendChild(item)});box.appendChild(details)}chat.appendChild(box);box.scrollIntoView({behavior:'smooth',block:'end'});return box}
async function ask(question){if(!question.trim())return;add(question,'user');input.value='';send.disabled=true;const waiting=add('正在检索简历知识库…','assistant');try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});const type=response.headers.get('content-type')||'';if(!type.includes('application/json'))throw new Error('API 路由未正确连接，请刷新后重试');const data=await response.json();if(!response.ok)throw new Error(data.detail||'服务暂时不可用');if(typeof data.answer!=='string'||!data.answer.trim())throw new Error('服务没有返回有效回答');waiting.remove();add(data.answer,'assistant',data.sources||[])}catch(error){waiting.textContent='暂时无法完成回答：'+error.message+'。请稍后重试。'}finally{send.disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();ask(input.value)});document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>ask(b.textContent)));
</script></body></html>
