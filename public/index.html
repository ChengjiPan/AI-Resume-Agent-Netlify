<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calvin AI Resume Assistant</title>
  <style>
    :root{--ink:#eff6ff;--muted:#97abc8;--line:rgba(117,169,255,.18);--brand:#48a7ff;--brand-strong:#1877f2;--paper:rgba(10,26,54,.68);--ground:#020817}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);background:radial-gradient(circle at 15% 0%,#123e7a 0,transparent 29rem),radial-gradient(circle at 84% 18%,#082f66 0,transparent 26rem),var(--ground);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:linear-gradient(rgba(113,180,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(113,180,255,.1) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 84%)}
    main{position:relative;max-width:960px;min-height:100vh;margin:auto;padding:50px 24px 36px;display:flex;flex-direction:column}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:38px}.eyebrow{display:flex;align-items:center;gap:8px;color:#b8dbff;font-weight:700;letter-spacing:.13em;font-size:11px;text-transform:uppercase}.pulse{width:8px;height:8px;border-radius:50%;background:#5ef5c4;box-shadow:0 0 0 5px rgba(94,245,196,.12),0 0 15px #5ef5c4}.status{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:rgba(8,27,56,.65);color:#8ea8c9;font-size:11px;white-space:nowrap}
    .hero{max-width:760px}.hero h1{font-size:clamp(38px,7vw,66px);line-height:1.02;margin:0 0 18px;letter-spacing:-.06em;background:linear-gradient(120deg,#fff 20%,#83c7ff 58%,#5e8dff);-webkit-background-clip:text;background-clip:text;color:transparent}.intro{max-width:650px;color:var(--muted);line-height:1.8;font-size:16px}
    .metrics{display:flex;flex-wrap:wrap;gap:10px;margin:29px 0}.metric{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(11,34,69,.54);color:#c9e2ff;font-size:12px}.metric strong{color:#63b1ff;font-weight:750}
    .suggestions{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 24px}button{font:inherit;cursor:pointer}.chip{background:rgba(8,31,65,.76);border:1px solid var(--line);border-radius:999px;color:#c9ddf7;padding:10px 14px;font-size:13px;transition:.2s}.chip:hover{border-color:#4fa7ff;box-shadow:0 0 20px rgba(67,158,255,.16);transform:translateY(-1px)}
    #chat{flex:1;display:flex;flex-direction:column;gap:16px;padding:8px 0 22px}.message{max-width:92%;border-radius:16px;padding:16px 18px;line-height:1.8;white-space:pre-wrap;animation:rise .25s ease-out}.assistant{background:linear-gradient(135deg,rgba(14,43,86,.83),rgba(6,20,46,.86));border:1px solid var(--line);align-self:flex-start;box-shadow:0 12px 35px rgba(0,0,0,.2)}.user{background:linear-gradient(135deg,#1b80ed,#2754ca);box-shadow:0 10px 28px rgba(18,105,223,.22);align-self:flex-end}
    .sources{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.sources summary{cursor:pointer;color:#a8ccf3;font-weight:700}.source-item{margin:8px 0 0;padding:9px 10px;border-radius:9px;background:rgba(2,11,29,.4);line-height:1.55}.source-title{color:#cbe5ff;font-weight:700}.source-excerpt{margin-top:4px;color:var(--muted)}
    form{display:flex;gap:10px;background:rgba(7,22,48,.82);padding:10px;border:1px solid rgba(104,173,255,.28);border-radius:16px;box-shadow:0 16px 45px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.05)}input{border:0;outline:0;flex:1;min-width:0;color:var(--ink);background:transparent;font:inherit;padding:9px}input::placeholder{color:#7186a4}.send{border:0;color:#fff;background:linear-gradient(135deg,#41adff,#2764e7);padding:10px 17px;border-radius:10px;font-weight:750;box-shadow:0 6px 18px rgba(34,119,239,.28)}.send:disabled{opacity:.55;cursor:wait}
    footer{color:#7186a4;font-size:11px;text-align:center;margin-top:16px;letter-spacing:.05em}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(max-width:560px){main{padding:28px 16px}.topline{margin-bottom:30px}.status{display:none}.hero h1{font-size:42px}.message{max-width:96%}.metric{font-size:11px}}
  </style>
</head>
<body><main>
  <div class="topline"><div class="eyebrow"><span class="pulse"></span>Personal Career AI Agent</div><div class="status">● RAG GROUNDED · QWEN READY</div></div>
  <section class="hero"><h1>Calvin AI<br>Resume Assistant</h1>
  <p class="intro">基于潘成己真实简历知识库的职业 AI Agent。像与候选人聊天一样，了解实习、项目、产品能力与职业优势。</p>
  <div class="metrics"><div class="metric"><strong>7</strong> 类知识资料</div><div class="metric"><strong>RAG</strong> 检索增强回答</div><div class="metric"><strong>Source</strong> 可查看依据</div></div></section>
  <div class="suggestions"><button class="chip">完整介绍京东健康 AI 分诊 Agent 项目</button><button class="chip">完整介绍支付宝 NFC 项目经历</button><button class="chip">你的产品能力和职业优势是什么？</button></div>
  <section id="chat" aria-live="polite"><div class="message assistant">你好，我是潘成己的 AI Resume Assistant。我的回答仅基于已整理的真实资料；如果资料不足，我会明确说明。</div></section>
  <form id="form"><input id="question" autocomplete="off" placeholder="输入你想了解的问题…" aria-label="问题"><button class="send" id="send" type="submit">发送</button></form>
  <footer>AI RESUME ASSISTANT · KNOWLEDGE-GROUNDED CONVERSATION</footer>
</main><script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#question'),send=document.querySelector('#send');
function add(text,role,sources=[]){const box=document.createElement('div');box.className='message '+role;box.textContent=text;if(sources.length){const details=document.createElement('details');details.className='sources';const summary=document.createElement('summary');summary.textContent=`查看资料依据（${sources.length} 条）`;details.appendChild(summary);sources.forEach(source=>{const item=document.createElement('div');item.className='source-item';const title=document.createElement('div');title.className='source-title';title.textContent=source.file+(source.section?` · ${source.section}`:'');item.appendChild(title);if(source.excerpt){const excerpt=document.createElement('div');excerpt.className='source-excerpt';excerpt.textContent=source.excerpt;item.appendChild(excerpt)}details.appendChild(item)});box.appendChild(details)}chat.appendChild(box);box.scrollIntoView({behavior:'smooth',block:'end'});return box}
async function ask(question){if(!question.trim())return;add(question,'user');input.value='';send.disabled=true;const waiting=add('正在检索简历知识库…','assistant');try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});const type=response.headers.get('content-type')||'';if(!type.includes('application/json'))throw new Error('API 路由未正确连接，请刷新后重试');const data=await response.json();if(!response.ok)throw new Error(data.detail||'服务暂时不可用');if(typeof data.answer!=='string'||!data.answer.trim())throw new Error('服务没有返回有效回答');waiting.remove();add(data.answer,'assistant',data.sources||[])}catch(error){waiting.textContent='暂时无法完成回答：'+error.message+'。请稍后重试。'}finally{send.disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();ask(input.value)});document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>ask(b.textContent)));
</script></body></html>
